<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Kerr's White Water Rafting Company</title>
    <meta name="description"
      content="Kerr's White Rafting Company(KWWR) contact informations. Contact us and we will provide service that you need!">
    <meta name="author" content="Kerr Raphael J. Asurto">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.jpg" alt="KWWR company logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Kerr's White Water Rafting Company</h1>
        <div class="info">
            <p> 123 Neverland Street </p>
            <p>Manila, Philipines</p>
            <p>+63-9999-999-999</p>
            <p>info@Whitewater.com</p>
        </div>

        <div class="mid">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2652.600561220601!2d121.00693101945042!3d14.583888840520036!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1791090963313!5m2!1sen!2sph"
              class="iframe" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                <label for="purpose">Message purpose</label>
                <label><input type="radio" name="purpose" id="purpose"
                      value="General Inquiry">General
                    Inquiry</label>
                <label><input type="radio" name="purpose" id="purpose"
                      value="Reservation Question">Reservation
                    Question</label>
                <label><input type="radio" name="purpose" id="purpose"
                      value="Website Suggestion">Website
                    Suggestion</label>
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="4"
                  placeholder="Type here..."></textarea>
                <label for="subscribe">Please subscribe me to the monthly newsletter <input
                      type="checkbox" id="subscribe" name="subscribe"></label>

                <button type="submit">Get in touch!</button>
            </form>

        </div>

        <section class="employees">
            <h2>We Are Here to Serve You!</h2>
            <figure><img src="images/employee-1.jpg" alt="employee-1">
                <figcaption>Spongebob Squarepants</figcaption>
            </figure>
            <figure><img src="images/employee-2.jpg" alt="employee-2">
                <figcaption>Patrick Star</figcaption>
            </figure>
            <figure><img src="images/employee-3.jpg" alt="mountain-view">
                <figcaption>Mr. Krabs</figcaption>
            </figure>

        </section>
    </main>
    <footer>
        <p>©️2026 🚣‍♂️ Kerr's White Water Company 🚣‍♂️ Kerr Asurto</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook-logo.png" alt="facebook icon">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin-icon.png" alt="linkedin icon">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram-logo.png" alt="">
            </a>
        </nav>
    </footer>


</body>

</html>
