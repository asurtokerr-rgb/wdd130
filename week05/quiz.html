<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>Basic HTML and CSS Quiz</header>
    <form>
        <label for="q1">1. Fill in the blank: ____ defines the structure and meaning of a web
            document.</label>
        <input type="text" id="q1" name="q1">
        <label for="q2">2. What is CSS?</label>
        <textarea name="q2" id="q2" row="4" placeholder="CSS is....."></textarea>
        <label for="q3">3. Which of the following is a valid CSS?</label>
        <select name="q3" id="q3">
            <option value="" selected disabled>Choose One...</option>
            <option value="1">border{23px};</option>
            <option value="2">margin: .5rem;</option>
            <option value="3">background-color(yellow);</option>
            <option value="4">display: {block}</option>
        </select>
        <label for="q4">4. What is the bottom margin given this declaration?</label>
        <p>margin: 10px 5px 15px;</p>
        <input type="number" id="q4" name="q4">
        <button type="submit">Submit Quiz</button>


    </form>
    <footer> ©️2026 | Basic HTML and CSS Quiz | Kerr Asurto</footer>
</body>

</html>
