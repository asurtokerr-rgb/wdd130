<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header> WDD 130 | HTML Form - User Poll</header>
    <main>
        <form>
            <h1>Contact Information</h1>
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
            </div>
            <div class="form-item column2">
                <input type="text" id="fullname" name="fullname" required>
                <label>Email:<input type="email" id="useremail" name="useremail" required></label>
            </div>
            <h1>Questions</h1>
            <div class="form-item column1">
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Safari</option>
                    <option value="3">Edge</option>
                    <option value="4">Brave</option>
                    <option value="5">Other</option>
                </select>
            </div>
            <div class="form-item column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet" value="pet">
            </div>
            <label for="feedback">List the places you have lived.</label>
            <textarea name="feedback" id="feedback" rows="4"
              placeholder="Manila Philippines, Tokyo Japan, Idaho USA "></textarea>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer> ©️2026 | HTML Form - User Poll | Kerr Asurto</footer>

</body>

</html>
